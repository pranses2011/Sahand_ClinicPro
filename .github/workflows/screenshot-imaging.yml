name: 📸 اسکرین‌شات واقعی تصویربرداری

# راستی‌آزمایی طراحی: صفحهٔ واقعی WPF روی ویندوز رندر و عکس آن آرتیفکت می‌شود
on:
  workflow_dispatch:
  push:
    branches: ['arena/a033bd8b-sahand-clinicpro']

jobs:
  screenshot:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: ساخت کلاینت دسکتاپ
        run: dotnet build src/Sahand.ClinicPro.Desktop/Sahand.ClinicPro.Desktop.csproj -c Release

      - name: رندر و اسکرین‌شات صفحهٔ تصویربرداری
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter Sahand.ClinicPro.Desktop.exe src/Sahand.ClinicPro.Desktop/bin/Release | Select-Object -First 1
          if ($null -eq $exe) { throw "exe not found" }
          New-Item -ItemType Directory -Force shots | Out-Null
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--imaging-screenshot', "$PWD/shots/imaging.png" -PassThru -Wait
          Write-Host "exit=$($p.ExitCode)"
          Get-ChildItem shots
          if (-not (Test-Path shots/imaging.png)) { throw "screenshot missing" }

      - name: بارگذاری اسکرین‌شات
        uses: actions/upload-artifact@v4
        with:
          name: imaging-screenshot
          path: shots/
          retention-days: 7

      - name: بازگرداندن اسکرین‌شات روی همان شاخه
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          New-Item -ItemType Directory -Force docs/screenshots | Out-Null
          Copy-Item shots/imaging.png docs/screenshots/imaging-real.png -Force
          git add docs/screenshots/imaging-real.png
          git commit -m "اسکرین‌شات واقعی تصویربرداری (رندر خودکار ویندوز)"
          git push origin HEAD:${{ github.ref_name }}
