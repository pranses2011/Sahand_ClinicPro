name: 🏗️ CI - Sahand ClinicPro

# اجرا روی push و pull_request به main و همچنین دستی
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:      # امکان اجرای دستی

jobs:
  build:
    name: 📦 Build & Test
    runs-on: windows-latest   # ویندوز به دلیل پروژه WPF

    steps:
