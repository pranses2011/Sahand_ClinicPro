name: 🔄 CI Build & Test

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: بازیابی پکیج‌ها
        run: dotnet restore Sahand.ClinicPro.sln

      - name: ساخت کامل Solution
        # لاگ در فایل ذخیره می‌شود تا گام بعدی بتواند خطاها را به‌صورت
        # «annotation» روی چک منتشر کند (دانلود لاگ خام گاهی در دسترس نیست
        # — مثلاً در محیط‌های محدود به میزبان‌های مجاز)
        run: |
          set -o pipefail
          dotnet build Sahand.ClinicPro.sln --no-restore -c Release 2>&1 | tee build-solution.log

      - name: گزارش خطاهای ساخت (annotation)
        if: failure()
        shell: bash
        run: |
          if [ ! -f build-solution.log ]; then
            echo "::error::فایل لاگ ساخت یافت نشد"
            exit 0
          fi
          # هر خطِ خطا/هشدار کامپایلر به یک annotation جدا تبدیل می‌شود
          { grep -E ": (error|warning) [A-Z]+[0-9]+" build-solution.log || true; } | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done || true
          exit 0

      - name: اجرای تست‌ها + پوشش کد (B4 چرخه ۱۲)
        # ═══ چرخهٔ ۶۷ — ریشهٔ قرمزیِ دائمی CI ═══
        # پروژهٔ تست دسکتاپ net8.0-windows است و WPF روی لینوکس اجرا نمی‌شود
        # («You must install or update .NET») — از اجرای ubuntu کنار گذاشته شد
        # و در job ویندوزیِ جداگانهٔ پایین اجرا می‌شود؛ این تنها راه سبز شدن
        # هر دو پلتفرم با حفظ پوشش کامل تست است.
        run: |
          set -o pipefail
          dotnet test Sahand.ClinicPro.sln --no-build -c Release \
             --logger "trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults \
             --filter "FullyQualifiedName!~Sahand.ClinicPro.Desktop.UnitTests" 2>&1 | tee test-run.log

      - name: گزارش تست‌های ناموفق (annotation)
        if: failure()
        shell: bash
        run: |
          # نام تست‌های ناموفق و پیام خطا از خروجی کنسول dotnet test خوانده
          # می‌شود (فایل trx هم موجود است ولی این مسیر ساده‌تر و مقاوم‌تر است)
          if [ ! -f test-run.log ]; then
            echo "::error::فایل test-run.log یافت نشد"
            exit 0
          fi
          # نکته: گام‌های bash در اکسِن‌ها با -e -o pipefail اجرا می‌شوند؛ بدون
          # || true، «نبودِ تطابق» یا بستن زودهنگام لوله به دست head (SIGPIPE)
          # خودِ گام گزارش را قرمز می‌کرد و هیچ annotation منتشر نمی‌شد.
          {
            grep -E "^[[:space:]]*Failed |Error Message:|Aborted|Unhandled exception|error [A-Z]+[0-9]+" test-run.log || true
            echo '─── پایان لاگ (۳۰ خط آخر) ───'
            tail -30 test-run.log || true
          } | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done || true
          exit 0

      - name: خلاصه پوشش
        if: always()
        run: |
          echo "## پوشش کد" >> $GITHUB_STEP_SUMMARY
          # چرخهٔ ۵۸: این گام از این پس با نبود نتایج هم سبز می‌ماند (find با -e می‌میرد)
          for f in $(find TestResults -name "cobertura.xml" 2>/dev/null || true); do
            echo "بیننده: $f" >> $GITHUB_STEP_SUMMARY
          done
          find TestResults -name "cobertura.xml" -exec echo "آرتیفکت: {}" \; || true

      - name: تولید سند OpenAPI (چرخه دوازدهم B3)
        run: |
          dotnet msbuild src/Sahand.ClinicPro.API/Sahand.ClinicPro.API.csproj -t:GenerateOpenApiDocuments
          mv docs/api/Sahand.ClinicPro.API.json docs/api/openapi.json || true
        env:
          PATH: ${{ env.PATH }}:/usr/share/dotnet

      - name: بارگذاری سند OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: docs/api/openapi.json
          retention-days: 30

      - name: بارگذاری نتایج تست
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults
          retention-days: 7

  # ═══ چرخهٔ ۶۷ — تست‌های دسکتاپ روی ویندوز ═══
  # ریشهٔ قرمزیِ دائمی CI از روز اول: پروژهٔ Desktop.UnitTests (net8.0-windows)
  # روی ubuntu اجرا نمی‌شود؛ اکنون در همین job ویندوزیِ اختصاصی اجرا می‌شود
  # و job لینوکسیِ بالا با فیلتر، از آن عبور می‌کند.
  desktop-tests:
    runs-on: windows-latest
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: بازیابی و ساخت پروژهٔ تست دسکتاپ
        run: dotnet build tests/Sahand.ClinicPro.Desktop.UnitTests/Sahand.ClinicPro.Desktop.UnitTests.csproj -c Release

      - name: اجرای تست‌های دسکتاپ (WPF — فقط ویندوز)
        run: dotnet test tests/Sahand.ClinicPro.Desktop.UnitTests/Sahand.ClinicPro.Desktop.UnitTests.csproj --no-build -c Release --logger "trx"

      - name: گزارش تست‌های ناموفق دسکتاپ (annotation)
        if: failure()
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Recurse -Filter *.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $trx) { Write-Host 'فایل trx یافت نشد'; exit 0 }
          [xml]$doc = Get-Content $trx.FullName
          foreach ($r in ($doc.SelectNodes("//*[local-name()='UnitTestResult' and @outcome='Failed']") | Select-Object -First 25)) {
            $msg = ''
            $node = $r.SelectSingleNode(".//*[local-name()='ErrorInfo']/*[local-name()='Message']")
            if ($node) { $msg = ($node.InnerText -replace "\s+", ' ').Trim() }
            Write-Host "::error::$($r.testName): $msg"
          }

      - name: بارگذاری نتایج تست دسکتاپ
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-results
          path: '**/TestResults/*.trx'
          retention-days: 7
          if-no-files-found: ignore

  # ═══ چرخه دوازدهم (C2 — بند ۴-۹): E2E سرور لایسنس PHP ═══
  # ═══ چرخهٔ ۶۶ (G-08 «بستن حلقه PHP»): +۱۴ تست بکاپ خودکار/چرخش کلید RSA ═══
  license-e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: lsc12
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ptestroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب PHP 8.2 + افزونه‌ها
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, openssl, json, mbstring

      - name: انتظار برای آماده‌شدن MySQL
        run: |
          for i in $(seq 1 30); do
            php -r 'try { new PDO("mysql:host=127.0.0.1;port=3306","root","testroot"); echo "READY"; } catch (Exception $e) { echo "0"; }' | grep -q READY && break
            sleep 2
          done

      - name: "اجرای تست‌های E2E سرور لایسنس (+۲۱ تست چرخهٔ ۶۶/۶۷: بکاپ، چرخش کلید، آینهٔ پیام‌ها)"
        env:
          MYSQL_ROOT_PASSWORD: testroot
        run: bash scripts/licsrv-e2e-ci.sh

      - name: شکست در صورت خطای تست
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: licsrv-e2e-logs
          path: |
            /tmp/lsc12/data/error.log
            /tmp/lsc12-server.log
          retention-days: 7
          if-no-files-found: ignore
