name: 🔄 CI Build & Test

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: بازیابی پکیج‌ها
        run: dotnet restore Sahand.ClinicPro.sln

      - name: ساخت کامل Solution
        run: dotnet build Sahand.ClinicPro.sln --no-restore -c Release

      - name: اجرای تست‌ها
        run: dotnet test Sahand.ClinicPro.sln --no-build -c Release --logger "trx" --results-directory ./TestResults

      - name: بارگذاری نتایج تست
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults
          retention-days: 7
