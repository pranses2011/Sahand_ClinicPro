name: 🔄 CI Build & Test

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: بازیابی پکیج‌ها
        run: dotnet restore Sahand.ClinicPro.sln

      - name: ساخت کامل Solution
        run: dotnet build Sahand.ClinicPro.sln --no-restore -c Release

      - name: اجرای تست‌ها + پوشش کد (B4 چرخه ۱۲)
        run: dotnet test Sahand.ClinicPro.sln --no-build -c Release --logger "trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: خلاصه پوشش
        if: always()
        run: |
          echo "## پوشش کد" >> $GITHUB_STEP_SUMMARY
          # چرخهٔ ۵۸: این گام از این پس با نبود نتایج هم سبز می‌ماند (find با -e می‌میرد)
          for f in $(find TestResults -name "cobertura.xml" 2>/dev/null || true); do
            echo "بیننده: $f" >> $GITHUB_STEP_SUMMARY
          done
          find TestResults -name "cobertura.xml" -exec echo "آرتیفکت: {}" \; || true

      - name: تولید سند OpenAPI (چرخه دوازدهم B3)
        run: |
          dotnet msbuild src/Sahand.ClinicPro.API/Sahand.ClinicPro.API.csproj -t:GenerateOpenApiDocuments
          mv docs/api/Sahand.ClinicPro.API.json docs/api/openapi.json || true
        env:
          PATH: ${{ env.PATH }}:/usr/share/dotnet

      - name: بارگذاری سند OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: docs/api/openapi.json
          retention-days: 30

      - name: بارگذاری نتایج تست
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults
          retention-days: 7

  # ═══ چرخه دوازدهم (C2 — بند ۴-۹): E2E سرور لایسنس PHP ═══
  license-e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: lsc12
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب PHP 8.2 + افزونه‌ها
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, openssl, json, mbstring

      - name: انتظار برای آماده‌شدن MySQL
        run: |
          for i in $(seq 1 30); do
            php -r 'try { new PDO("mysql:host=127.0.0.1;port=3306","root","testroot"); echo "READY"; } catch (Exception $e) { echo "0"; }' | grep -q READY && break
            sleep 2
          done

      - name: اجرای ۳۴ تست E2E سرور لایسنس
        env:
          MYSQL_ROOT_PASSWORD: testroot
        run: bash scripts/licsrv-e2e-ci.sh

      - name: شکست در صورت خطای تست
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: licsrv-e2e-logs
          path: /tmp/lsc12/data/error.log
          retention-days: 7
