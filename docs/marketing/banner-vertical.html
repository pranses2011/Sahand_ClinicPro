<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بنر عمودی — درمانگاه سهند</title>
<style>
@font-face { font-family:'Vazirmatn'; src:url('../assets/fonts/Vazirmatn-Regular.ttf') format('truetype'); font-weight:400; }
@font-face { font-family:'Vazirmatn'; src:url('../assets/fonts/Vazirmatn-Bold.ttf') format('truetype'); font-weight:700; }
@font-face { font-family:'Vazirmatn'; src:url('../assets/fonts/Vazirmatn-ExtraBold.ttf') format('truetype'); font-weight:800; }
@font-face { font-family:'Vazirmatn'; src:url('../assets/fonts/Vazirmatn-Black.ttf') format('truetype'); font-weight:900; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:4252px; height:8504px; }
body { font-family:'Vazirmatn',sans-serif; direction:rtl;
  background:linear-gradient(170deg,#082B5C 0%,#0D47A1 40%,#1565C0 62%,#00897B 100%);
  color:#fff; overflow:hidden; position:relative; }
.deco { position:absolute; border-radius:50%; }
.d1 { width:3000px; height:3000px; top:-1000px; left:-900px;
  background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%); }
.d2 { width:2600px; height:2600px; bottom:-1000px; right:-900px;
  background:radial-gradient(circle,rgba(0,255,200,.09),transparent 70%); }
.wrap { position:relative; z-index:5; height:100%; padding:240px 200px;
  display:flex; flex-direction:column; align-items:center; text-align:center; }
.logo-circle { width:1100px; height:1100px; border-radius:50%;
  background:rgba(255,255,255,.13); border:10px solid rgba(255,255,255,.4);
  display:flex; align-items:center; justify-content:center; font-size:600px;
  box-shadow:0 80px 200px rgba(0,0,0,.35); }
.brand-en { font-size:140px; letter-spacing:28px; opacity:.85; font-weight:700; margin-top:100px; direction:ltr; }
.brand-fa { font-size:280px; font-weight:900; margin-top:20px; }
h1 { font-size:330px; font-weight:900; line-height:1.4; margin-top:130px;
  text-shadow:0 30px 90px rgba(0,0,0,.4); }
h1 .hl { color:#A5F3FC; }
.sub { font-size:150px; font-weight:500; opacity:.95; margin-top:70px; line-height:1.7; }
.tag { display:inline-block; margin-top:140px; font-size:190px; font-weight:900;
  background:linear-gradient(90deg,#FF8F00,#FFB300); color:#3E2723;
  border-radius:160px; padding:50px 150px; box-shadow:0 40px 100px rgba(255,143,0,.45); }
.contact { margin-top:auto; width:100%; background:rgba(0,0,0,.30);
  border-radius:90px; padding:140px 100px; backdrop-filter:blur(6px); }
.contact .lbl { font-size:150px; font-weight:700; }
.contact .tel { font-size:340px; font-weight:900; direction:ltr; color:#A5F3FC;
  margin-top:40px; letter-spacing:8px; }
.contact .web { font-size:120px; opacity:.9; margin-top:60px; }
</style>
</head>
<body>
<div class="deco d1"></div><div class="deco d2"></div>
<div class="wrap">
  <div class="logo-circle">🏥</div>
  <div class="brand-en">SAHAND CLINICPRO</div>
  <div class="brand-fa">درمانگاه سهند</div>
  <h1>مدیریت درمانگاه<br>با <span class="hl">یک نرم‌افزار</span></h1>
  <div class="sub">پذیرش • نوبت‌دهی • نسخه الکترونیک<br>مالی • حضور و غیاب</div>
  <div class="tag">⭐ اتصال مستقیم دستگاه حضور و غیاب</div>
  <div class="contact">
    <div class="lbl">دموی رایگان 🎁</div>
    <div class="tel">۰۴۱-۳۳۴۵۶۷۸۹</div>
    <div class="web">sahand-clinicpro.ir</div>
  </div>
</div>
</body>
</html>
