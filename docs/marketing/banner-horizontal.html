<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بنر بیلبورد افقی — درمانگاه سهند</title>
<style>
@font-face { font-family:'Vazirmatn'; src:url('../assets/fonts/Vazirmatn-Regular.ttf') format('truetype'); font-weight:400; }
@font-face { font-family:'Vazirmatn'; src:url('../assets/fonts/Vazirmatn-Medium.ttf') format('truetype'); font-weight:500; }
@font-face { font-family:'Vazirmatn'; src:url('../assets/fonts/Vazirmatn-SemiBold.ttf') format('truetype'); font-weight:600; }
@font-face { font-family:'Vazirmatn'; src:url('../assets/fonts/Vazirmatn-Bold.ttf') format('truetype'); font-weight:700; }
@font-face { font-family:'Vazirmatn'; src:url('../assets/fonts/Vazirmatn-ExtraBold.ttf') format('truetype'); font-weight:800; }
@font-face { font-family:'Vazirmatn'; src:url('../assets/fonts/Vazirmatn-Black.ttf') format('truetype'); font-weight:900; }
* { margin:0; padding:0; box-sizing:border-box; }
/* بیلبورد ۳×۱.۵ متر @ ۲۸۳dpi */
html, body { width:8504px; height:4252px; overflow:hidden; }
body { font-family:'Vazirmatn','Noto Color Emoji',sans-serif; direction:rtl; color:#fff;
  position:relative; background:#040A1C; }

/* ═══════ لایه ۱ — پس‌زمینه عمق‌دار ═══════ */
.bg { position:absolute; inset:0; overflow:hidden; z-index:0; }
.bg .grad { position:absolute; inset:0;
  background:
    radial-gradient(2600px 1800px at 86% -12%, rgba(14,116,144,.44), transparent 62%),
    radial-gradient(2200px 1600px at 8% 112%, rgba(16,185,129,.22), transparent 60%),
    radial-gradient(1800px 1400px at 50% 55%, rgba(37,59,156,.32), transparent 64%),
    linear-gradient(166deg,#040A1C 0%,#071531 40%,#0A2A52 74%,#0C3B54 100%); }
.bg .dots { position:absolute; inset:0; opacity:.16;
  background-image:radial-gradient(rgba(148,196,255,.44) 4px, transparent 4px);
  background-size:120px 120px;
  -webkit-mask-image:radial-gradient(ellipse 80% 66% at 40% 34%, #000 22%, transparent 72%);
          mask-image:radial-gradient(ellipse 80% 66% at 40% 34%, #000 22%, transparent 72%); }
.bg .glow1 { position:absolute; top:-14%; right:8%; width:2600px; height:2600px; border-radius:50%;
  background:radial-gradient(circle, rgba(56,189,248,.18), transparent 64%); filter:blur(10px); }
.bg .glow2 { position:absolute; bottom:-18%; left:8%; width:2300px; height:2300px; border-radius:50%;
  background:radial-gradient(circle, rgba(16,185,129,.15), transparent 64%); filter:blur(12px); }
.bg .wave1 { position:absolute; left:-5%; right:-5%; bottom:-420px; height:1000px;
  border-radius:50% 50% 0 0; background:rgba(12,59,84,.5); }
.bg .wave2 { position:absolute; left:-12%; right:-12%; bottom:-640px; height:1050px;
  border-radius:50% 50% 0 0; background:rgba(8,38,68,.7); }

/* ═══════ لایه ۲ — محتوای بیلبورد: خوانایی از دور ═══════ */
.wrap { position:relative; z-index:5; height:100%; display:flex; align-items:center;
  justify-content:space-between; gap:120px; padding:200px 260px; }

/* ستون پیام — تیتر بسیار درشت */
.msg { flex:1.2; display:flex; flex-direction:column; }
.brand-row { display:flex; align-items:center; gap:64px; }
.logo-badge { width:300px; height:300px; border-radius:72px; position:relative; overflow:hidden;
  background:radial-gradient(circle at 50% 24%, #EAF6FF, #BFE0F8 74%);
  box-shadow:0 14px 34px rgba(2,20,50,.45), 0 44px 96px rgba(2,40,90,.5),
    0 0 0 14px rgba(255,255,255,.08), 0 0 0 20px rgba(255,255,255,.045);
  display:flex; align-items:center; justify-content:center; flex:none; }
.logo-badge img { width:254px; height:254px; object-fit:contain; border-radius:54px; }
.logo-badge::after { content:''; position:absolute; inset:0; border-radius:72px;
  background:linear-gradient(155deg, rgba(255,255,255,.42), transparent 48%); }
.brand-text .en { font-size:56px; letter-spacing:20px; font-weight:600; opacity:.72; direction:ltr; text-align:right; }
.brand-text .fa { font-size:118px; font-weight:900; margin-top:12px; line-height:1.15;
  background:linear-gradient(100deg,#FFFFFF 30%,#9EE7FF 74%,#5EEAD4 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; }

h1 { font-size:300px; font-weight:900; line-height:1.14; margin-top:110px; letter-spacing:-4px; }
h1 .hl { background:linear-gradient(100deg,#67E8F9 8%,#5EEAD4 55%,#A7F3D0 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; }
.sub { font-size:92px; font-weight:500; opacity:.92; margin-top:56px; line-height:1.7; max-width:4200px; }
.badge-new { display:inline-flex; align-items:center; gap:34px; margin-top:82px; width:fit-content;
  background:linear-gradient(120deg,#FBBF24,#F59E0B); color:#3B2100;
  border-radius:120px; padding:36px 92px; font-size:84px; font-weight:800;
  box-shadow:0 28px 64px rgba(245,158,11,.4), inset 0 4px 8px rgba(255,255,255,.5); }

/* ستون تماس — از دور خوانا */
.contact-card { flex:none; width:2050px; border-radius:80px; padding:110px 120px;
  background:linear-gradient(115deg, rgba(14,124,134,.94), rgba(16,163,110,.95));
  box-shadow:0 44px 100px rgba(4,80,74,.5), inset 0 3px 8px rgba(255,255,255,.26); }
.contact-card .lead { font-size:96px; font-weight:900; line-height:1.5; }
.contact-card .sep { height:3px; background:rgba(255,255,255,.35); border-radius:3px; margin:64px 0; }
.contact-card .row { display:flex; align-items:center; gap:36px; font-size:88px; font-weight:800;
  direction:ltr; text-align:left; margin-bottom:46px; }
.contact-card .row .em { font-size:82px; }
.contact-card .row.fa { direction:rtl; text-align:right; font-size:70px; font-weight:700; opacity:.95; margin-bottom:0; }

/* ─── ستون چپ: کارت‌های عمق + تماس — ترکیب‌بندی یکپارچه ─── */
.col-side { flex:none; width:2150px; display:flex; flex-direction:column; justify-content:center; gap:56px; }
.float-card { position:relative; z-index:4; border-radius:56px; padding:48px 76px;
  background:rgba(10,28,58,.8); border:4px solid rgba(125,233,250,.38); backdrop-filter:blur(12px);
  box-shadow:0 44px 100px rgba(1,12,34,.62), inset 0 4px 8px rgba(255,255,255,.16);
  display:flex; align-items:center; gap:38px; color:#EAF9FF; }
.float-card .em { font-size:84px; }
.float-card .t { font-size:60px; font-weight:800; }
/* لایه‌بندی عمق: مقیاس/حاشیه متفاوت هر پیل */
.float-card.fc-a { transform:scale(1.03); margin-right:90px;
  border-color:rgba(167,243,208,.5); }
.float-card.fc-b { transform:scale(.95); margin-left:110px; opacity:.97; }
.orb-front { position:absolute; z-index:5; width:130px; height:130px; border-radius:50%;
  top:-46px; left:60px;
  background:radial-gradient(circle at 32% 30%, #FFE9B8, #F59E0B 56%, #92600A);
  box-shadow:0 30px 70px rgba(245,158,11,.5), inset -16px -20px 40px rgba(110,66,7,.55); }
.orb-front.o2 { top:auto; bottom:-38px; left:auto; right:70px; width:84px; height:84px;
  background:radial-gradient(circle at 32% 30%, #C7F9E5, #34D399 56%, #047857);
  box-shadow:0 22px 52px rgba(52,211,153,.45), inset -11px -13px 26px rgba(4,120,87,.55); }
.col-side-inner { position:relative; display:flex; flex-direction:column; gap:56px; }
</style>
</head>
<body>
<div class="bg">
  <div class="grad"></div><div class="dots"></div><div class="glow1"></div><div class="glow2"></div>
  <div class="wave1"></div><div class="wave2"></div>
</div>

<div class="wrap">
  <div class="msg">
    <div class="brand-row">
      <div class="logo-badge"><img src="../assets/ClinicPro.png" alt="لوگوی درمانگاه سهند"></div>
      <div class="brand-text">
        <div class="en">SAHAND CLINICPRO</div>
        <div class="fa">درمانگاه سهند</div>
      </div>
    </div>

    <h1>مدیریت درمانگاه<br>با <span class="hl">یک نرم‌افزار</span></h1>
    <div class="sub">از پذیرش بیمار تا فیش حقوقی پرسنل — کاملاً فارسی و جلالی</div>
    <div class="badge-new">⭐ ۳۹+ ماژول یکپارچه</div>
  </div>

  <div class="col-side">
    <div class="col-side-inner">
      <div class="orb-front"></div>
      <div class="orb-front o2"></div>
      <div class="float-card fc-a"><span class="em">📈</span><span class="t">۲۵ گزارش نموداری</span></div>
      <div class="float-card fc-b"><span class="em">🏛</span><span class="t">مچ با سپاس و نسخه الکترونیک</span></div>
    </div>

    <div class="contact-card">
      <div class="lead">همین امروز<br>دمو بگیرید 🎁</div>
      <div class="sep"></div>
      <div class="row"><span class="em">📞</span> 041-34436141</div>
      <div class="row"><span class="em">📱</span> 09144220430</div>
      <div class="row" style="font-size:66px"><span class="em">🌐</span> ea-fixer.ir</div>
      <div class="row fa">سعید نجفی — سهند سرویس</div>
    </div>
  </div>
</div>
</body>
</html>
